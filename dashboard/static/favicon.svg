<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Squircle Background: RGB(27, 27, 27) / #1B1B1B -->
  <rect width="100" height="100" rx="22" fill="rgb(27, 27, 27)" />

  <!-- Voice Equalizer Bars (Dynamic/Varied Speech Waveform) -->
  <g stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round">
    <line x1="12" y1="45" x2="12" y2="55" />
    <line x1="18" y1="32" x2="18" y2="68" />
    <line x1="24" y1="41" x2="24" y2="59" />
    <line x1="30" y1="22" x2="30" y2="78" />
    <line x1="36" y1="38" x2="36" y2="62" />
    <line x1="42" y1="28" x2="42" y2="72" />
    <line x1="48" y1="43" x2="48" y2="57" />
  </g>

  <!-- Solid Red ECG Pulse Wave -->
  <path d="M 54 50 L 59 50 L 62 43 L 65 53 L 70 28 L 76 72 L 81 50 L 88 50" 
        fill="none" 
        stroke="#EF4444" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Solid Red Alert Beacon Dot -->
  <circle cx="89" cy="50" r="3.8" fill="#EF4444" />
</svg>
