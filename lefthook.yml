# Git hooks for the whole repository (ADR-002). One toolchain per folder (ADR-001).
# Install once per clone: brew install lefthook && lefthook install
# Fast checks on commit, Gradle on push. A job runs only when its glob matches.
min_version: 2.2.0

pre-commit:
  parallel: true
  jobs:
    - name: backend
      root: backend/
      glob: "*.py"
      group:
        piped: true # fix, then format, then test: they touch the same files
        jobs:
          - run: uv run ruff check --fix {staged_files}
            stage_fixed: true
          - run: uv run ruff format {staged_files}
            stage_fixed: true
          - run: uv run lint-imports
          - run: uv run pytest -q

    - name: dashboard
      root: dashboard/
      glob: "*.{ts,js,json,css,html,svelte}"
      group:
        piped: true
        jobs:
          - run: npx --no vp check --fix
            stage_fixed: true
          - run: npx --no -- svelte-check --tsgo --fail-on-warnings

    - name: android
      root: android/
      glob: "*.{kt,kts}"
      run: ./gradlew -q ktlintFormat
      stage_fixed: true

    - name: ios
      root: ios/
      glob: "*.swift"
      group:
        piped: true
        jobs:
          - run: swift format format --in-place --configuration .swift-format {staged_files}
            stage_fixed: true
          - run: swift format lint --strict --configuration .swift-format {staged_files}
          - run: swift test --package-path Shared

pre-push:
  jobs:
    - name: android
      root: android/
      glob: "*.{kt,kts,xml,toml,properties,pro}"
      run: ./gradlew ktlintCheck lint testDebugUnitTest :shared:test

    - name: ios
      glob: "ios/**"
      run: >-
        swift format lint --strict --parallel --recursive --configuration ios/.swift-format ios/EchoCare ios/EchoCareWatch ios/EchoCareTests ios/Shared &&
        swift test --package-path ios/Shared &&
        xcodebuild build-for-testing -project ios/EchoCare.xcodeproj -scheme EchoCare -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet &&
        xcodebuild build -project ios/EchoCare.xcodeproj -scheme EchoCareWatch -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
