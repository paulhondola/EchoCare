# Checks for the dashboard service (ADR-001). Runs on pushes to main and release too,
# so Railway's "Wait for CI" has a result to wait for. Not a required check (path-filtered).
name: dashboard

on:
  pull_request:
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]
  push:
    branches: [main, release]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: dashboard

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26 # same major as dashboard/Dockerfile
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx vp check # oxfmt, oxlint, type check (ADR-002)
      - run: npx svelte-check --tsgo --fail-on-warnings
      - run: npx vp build
      - run: npx vp test
      # Known vulnerabilities in what ships to the browser. Reports only, never blocks a deploy
      # (design 2026-11-14).
      - name: Audit dependencies (report only)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
