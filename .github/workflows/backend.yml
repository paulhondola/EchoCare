# Checks for the api service (ADR-001). Railway's "Wait for CI" holds a deploy until this passes,
# so it must also run on pushes to main (staging) and release (production), not only on PRs.
# Do not mark it as a required check: path-filtered workflows never report on other PRs.
name: backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main, release]
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    # tests/conftest.py points at echocare_test on localhost (auth-layer §6.4)
    services:
      postgres:
        image: postgres:18 # the major version of Railway's Postgres and Compose's
        env:
          POSTGRES_USER: echocare
          POSTGRES_PASSWORD: echocare
          POSTGRES_DB: echocare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U echocare"
          --health-interval 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no moving major tag (v10), only full versions
      - uses: astral-sh/setup-uv@v10.4.0 # installs the Python in backend/.python-version
        with:
          working-directory: backend
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run pytest
      # Known vulnerabilities in the locked runtime dependencies. Reports only: Railway waits
      # for CI, so an advisory published on demo day must not hold back a fix (design 2026-11-14).
      - name: Audit dependencies (report only)
        continue-on-error: true
        run: uv export --locked --no-dev --format requirements-txt --no-hashes | uvx pip-audit -r /dev/stdin --no-deps --disable-pip
