[project]
name = "sentinela-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "boto3>=1.40.61",
    "fastapi>=0.143.0",
    "firebase-admin>=7.7.0",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.41",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
# One event loop for the whole run: app.db's module-level engine pools asyncpg
# connections, which belong to the loop that opened them (auth-layer §6.2).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "moto[s3]>=5.2.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Inside a feature: router, then service, then schemas, then models"
type = "layers"
containers = [
    "app.auth",
    "app.incidents",
    "app.seniors",
    "app.staff",
    "app.system",
    "app.voice",
]
layers = ["router", "(service)", "(schemas)", "(models)"]

[[tool.importlinter.contracts]]
name = "Only app.main imports a router"
type = "protected"
protected_modules = ["app.*.router"]
allowed_importers = ["app.main"]

[[tool.importlinter.contracts]]
name = "Package __init__ files import nothing; app.models is the one aggregator"
type = "forbidden"
source_modules = [
    "app.auth",
    "app.core",
    "app.incidents",
    "app.seniors",
    "app.staff",
    "app.status",
    "app.system",
    "app.voice",
]
forbidden_modules = ["app.**"]
as_packages = false

[[tool.importlinter.contracts]]
name = "The status engine is pure logic (01 §8)"
type = "forbidden"
source_modules = ["app.status"]
forbidden_modules = [
    "fastapi",
    "httpx",
    "sqlalchemy",
    "app.auth",
    "app.core",
    "app.incidents",
    "app.main",
    "app.models",
    "app.seniors",
    "app.staff",
    "app.system",
    "app.voice",
]

[[tool.importlinter.contracts]]
name = "app.models is for Alembic, scripts and tests, not for app/"
type = "forbidden"
source_modules = [
    "app.auth",
    "app.core",
    "app.incidents",
    "app.main",
    "app.seniors",
    "app.staff",
    "app.status",
    "app.system",
    "app.voice",
]
forbidden_modules = ["app.models"]

[[tool.importlinter.contracts]]
name = "No import cycles between packages; routers sit above them all"
type = "acyclic_siblings"
ancestors = ["app"]
depth = 0
ignore_imports = ["app.*.router -> app.**"]
